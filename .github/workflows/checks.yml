name: Checks
on:
  pull_request:
  push:
    branches: [main, codex/mvp]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check JavaScript syntax
        run: for file in js/*.js scripts/*.mjs; do node --check "$file"; done
